name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.12"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q -m 'not integration'
      - run: uv run ach-demo evaluate --output artifacts/evaluation.json
      - run: docker compose up --build -d --wait --wait-timeout 180
      - name: Real Moov and PostgreSQL integration
        env:
          TEST_MOOV_URL: http://127.0.0.1:8081
          TEST_DATABASE_URL: postgresql+psycopg://ach:synthetic-local-only@127.0.0.1:5432/ach
        run: uv run pytest -q -m integration
      - run: uv run ach-demo smoke
      - if: always()
        run: docker compose logs --tail 80
      - if: always()
        run: docker compose down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measured-evaluation
          path: artifacts/evaluation.json
